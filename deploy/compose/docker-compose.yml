services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orgbrain
      POSTGRES_PASSWORD: orgbrain
      POSTGRES_DB: orgbrain
    ports:
      - "5432:5432"
    volumes:
      - orgbrain_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orgbrain_pg:
