[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "org-brain"
version = "0.1.0"
description = "Self-bootstrapping knowledge platform for engineering agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Org Brain Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer[all]>=0.12.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "types-jsonschema>=4.23.0",
  "httpx>=0.27.0",
]
vector = [
  "pgvector>=0.3.6",
]

[project.scripts]
org-brain = "org_brain.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/org_brain"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/org_brain",
  "/schemas",
  "/templates",
  "/config",
  "/prompts",
  "/migrations",
  "/docs",
  "/specs",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_ignores = false
packages = ["org_brain"]
mypy_path = "src"
ignore_missing_imports = true
